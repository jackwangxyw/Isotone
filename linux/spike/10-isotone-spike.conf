# Isotone stage 1c measurement rig: the virtual sink applications play into, and
# a stand-in for the hardware sink. Declared here rather than loaded with pactl
# so they come back with the daemon and a run is reproducible.
context.objects = [
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "isotone_virt"
          node.description = "Isotone virtual sink"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          audio.rate       = 48000
          object.linger    = true
          # Keeps the sink from suspending between measurements, which
          # would drop its ports and make a run flaky. It does not create
          # the ports: an adapter gets those when a session manager sets
          # PortConfig mode=dsp on it, which is why the rig needs
          # WirePlumber even when it runs headless.
          node.always-process = true
      }
    }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = "isotone_hw"
          node.description = "Isotone stand-in hardware sink"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          audio.rate       = 48000
          object.linger    = true
          # Keeps the sink from suspending between measurements, which
          # would drop its ports and make a run flaky. It does not create
          # the ports: an adapter gets those when a session manager sets
          # PortConfig mode=dsp on it, which is why the rig needs
          # WirePlumber even when it runs headless.
          node.always-process = true
      }
    }
]
