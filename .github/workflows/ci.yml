name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # The APO is loaded into audiodg.exe on a user's machine, so it is worth
      # proving the COM lifecycle and the audio path in CI, where a fault is an
      # exit code rather than a machine with no sound. This registers nothing and
      # opens no audio device, so it runs fine on a headless runner.
      # The exe location depends on the generator: single-config puts it in
      # build/windows/apo, multi-config (the Visual Studio default on the Windows
      # runner) adds a per-config subdirectory. Find it rather than guess, and
      # run from its own directory so LoadLibrary finds IsoAPO.dll beside it.
      - name: APO self test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter isotone-apo-selftest.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "isotone-apo-selftest.exe was not built" }
          Push-Location $exe.DirectoryName
          ./isotone-apo-selftest.exe
          exit $LASTEXITCODE

      # The same APO build served in real time from one process and driven from
      # another with isotone-shm, the way the UI will reach it: heartbeat,
      # parameter writes, and audio measured back out of the ring.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Shared-memory transport, cross process
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet numpy
          python tools/check_shm_transport.py build

  reference-data:
    name: reference data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: python -m pip install --quiet numpy scipy

      # The checked-in reference files must still be what the generator
      # produces, or the cross-check against scipy is validating stale data.
      #
      # Compared numerically, not textually: two scipy or libm builds disagree in
      # the last bit of a 17-digit double, so `git diff` fails on a different
      # machine for reasons that say nothing about correctness. The tolerance is
      # 1e-9 dB, five orders of magnitude tighter than the 0.01 dB the C++ tests
      # assert, so a real change cannot slip through.
      - name: Check the reference data still matches
        run: python tools/gen_reference.py --check
