name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # The APO is loaded into audiodg.exe on a user's machine, so it is worth
      # proving the COM lifecycle and the audio path in CI, where a fault is an
      # exit code rather than a machine with no sound. This registers nothing and
      # opens no audio device, so it runs fine on a headless runner.
      - name: APO self test
        if: runner.os == 'Windows'
        working-directory: build/windows/apo
        run: ./isotone-apo-selftest.exe

  reference-data:
    name: reference data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: python -m pip install --quiet numpy scipy

      # The checked-in reference files must be exactly what the generator
      # produces, or the cross-check against scipy is checking stale data.
      # The scipy version line is allowed to differ between runners.
      - name: Regenerate and compare
        run: |
          python tools/gen_reference.py
          git diff --exit-code -I '^# scipy ' -- core/tests/reference/
