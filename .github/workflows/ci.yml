name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DISOTONE_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        run: ctest --test-dir build --build-config RelWithDebInfo --output-on-failure

      # The APO is loaded into audiodg.exe on a user's machine, so it is worth
      # proving the COM lifecycle and the audio path in CI, where a fault is an
      # exit code rather than a machine with no sound. This registers nothing and
      # opens no audio device, so it runs fine on a headless runner.
      # The exe location depends on the generator: single-config puts it in
      # build/windows/apo, multi-config (the Visual Studio default on the Windows
      # runner) adds a per-config subdirectory. Find it rather than guess, and
      # run from its own directory so LoadLibrary finds IsoAPO.dll beside it.
      - name: APO self test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter isotone-apo-selftest.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "isotone-apo-selftest.exe was not built" }
          Push-Location $exe.DirectoryName
          ./isotone-apo-selftest.exe
          exit $LASTEXITCODE

      # The same APO build served in real time from one process and driven from
      # another with isotone-shm, the way the UI will reach it: heartbeat,
      # parameter writes, and audio measured back out of the ring.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'

      - name: Shared-memory transport, cross process
        if: runner.os == 'Windows'
        run: |
          python -m pip install --quiet numpy
          python tools/check_shm_transport.py build

  linux-host:
    name: linux host (daemon, measured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # libpipewire-0.3-dev is what the top-level list file looks for before it
      # adds linux/spike and linux/daemon at all; without it this job silently
      # builds the same thing the core job already does. pipewire-bin carries
      # pw-link, pw-play and pw-record, which the measurement drives the graph
      # with, and dbus-x11 carries dbus-run-session, which WirePlumber needs.
      - name: Install PipeWire
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libpipewire-0.3-dev pipewire pipewire-bin wireplumber dbus-x11 python3-numpy
          # Qt for the UI, which builds on Linux. find_package asks for every
          # component the Windows UI uses.
          sudo apt-get install -y -qq qt6-base-dev qt6-declarative-dev qt6-base-dev-tools
          # The app runs offscreen in the measurement, so the QML modules it
          # imports have to be there at run time too; the X11 and xcb headers are
          # the global hotkeys', Xvfb is the X server their grab test runs against,
          # and python3-dbus and python3-gi run the mock portal their portal test binds with.
          sudo apt-get install -y -qq libx11-dev libxcb1-dev xvfb python3-dbus python3-gi \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-shapes qml6-module-qtquick-dialogs qml6-module-qtcore qml6-module-qttest \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-controls qml6-module-qtquick-layouts

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DISOTONE_WARNINGS_AS_ERRORS=ON -DISOTONE_BUILD_UI=ON

      - name: Build
        run: cmake --build build

      # The Linux host has to actually be in this build, or the job proves
      # nothing: without libpipewire the top-level list file skips linux/spike
      # and linux/daemon and everything here still passes. Fail loudly rather
      # than pass quietly.
      - name: The Linux host is in the build
        run: |
          test -x build/linux/daemon/isotone-daemon || { echo "the daemon was not built"; exit 1; }
          test -x build/linux/spike/isotone-pw-spike || { echo "the spike was not built"; exit 1; }
          test -x build/linux/daemon/isotone-state || { echo "isotone-state was not built"; exit 1; }
          test -x build/ui/ui_tests || { echo "the UI tests were not built"; exit 1; }
          test -x build/ui/isotone || { echo "the app was not built"; exit 1; }

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The stage 1c and stage 3 acceptance measurements, through a real PipeWire
      # graph. Both ends are null sinks, so no audio hardware is involved; the
      # script starts its own PipeWire, WirePlumber and D-Bus session.
      - name: Measure the daemon and the spike
        run: bash linux/ci-audio.sh

  reference-data:
    name: reference data is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scipy
        run: python -m pip install --quiet numpy scipy

      # The checked-in reference files must still be what the generator
      # produces, or the cross-check against scipy is validating stale data.
      #
      # Compared numerically, not textually: two scipy or libm builds disagree in
      # the last bit of a 17-digit double, so `git diff` fails on a different
      # machine for reasons that say nothing about correctness. The tolerance is
      # 1e-9 dB, five orders of magnitude tighter than the 0.01 dB the C++ tests
      # assert, so a real change cannot slip through.
      - name: Check the reference data still matches
        run: python tools/gen_reference.py --check
